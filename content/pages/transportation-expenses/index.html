

      <section id="form">
        <div class="head03 head01--cnt subpage-hero" style="--page-photo: url(/images/top/elevate/sky-blue.jpg)">
          <p class="head03-ttl__sub">登録スタッフの方</p>
          <h1 class="head03-ttl">交通費申請フォーム</h1>
        </div>
        <div class="inner inner--gray innner-form mt70-w mt100-n">

          <div class="form-lead">
  <p class="form-lead__txt">交通費の申請をご希望の方は、専用フォームより必要事項をご入力のうえ、申請手続きを行ってください。<br/>申請内容を確認後、順次対応させていただきます。</p>
</div>

<div class="form-cnt">
    <form action="https://elevate-works.jp/transportation-expenses/" class="h-adr" method="post" name="mainForm">
    <span class="p-country-name" style="display:none;">Japan</span>
    <div class="form__main">

      <div class="form__block">
        <label class="form__ttl form__ttl--require" for="field-0-0" id="field-label-0">
<em>氏名</em>
</label>
        <div class="form__item">
          <input aria-labelledby="field-label-0" class="form__input form__input--min" id="field-0-0" name="name" placeholder="例）山田太郎" required="" type="text" value=""/>
                  </div>
      </div>

      <div class="form__block">
        <label class="form__ttl form__ttl--require" for="field-1-0" id="field-label-1">
<em>ID</em>
</label>
        <div class="form__item">
          <input aria-labelledby="field-label-1" class="form__input form__input--min" id="field-1-0" name="id" placeholder="例）12345" required="" type="text" value=""/>
          <p class="form__item-comment">※ID未取得の方は、「00000」と入力ください</p>
                  </div>
      </div>

      <div class="form__block">
        <label class="form__ttl form__ttl--require" for="field-2-0" id="field-label-2">
<em>日付・就業先・<br/>通勤方法</em>
</label>
        <div class="form__item">
          <textarea aria-labelledby="field-label-2" class="form__textarea" id="field-2-0" name="message" placeholder="例）12月17日○○会社 車、12月18日△△会社 電車で泉大津駅～岸和田駅420円" required="">
</textarea>
          <p class="form__item-comment">※交通機関をご利用の場合は、区間とかかった費用をご入力ください。</p>
                  </div>
      </div>
    </div>

    <div class="form-policy">
            <p class="form-policy__desc">個人情報の取り扱いについて<a class="form-policy__link" href="/privacy/index.html" rel="noopener noreferrer" target="_blank">プライバシーポリシー</a>をご確認頂き、同意の上送信してください。</p>
      <label class="form-policy__check">
<input name="policy_chk" required="" type="checkbox" value="1"/>
<span class="form-policy__agree">同意する</span>
</label>
      <div class="form-policy__error">
</div>
    </div>

    <div class="form-button-area">
      <input name="send_flg" type="hidden" value="1"/>
      <button class="btn02 form__btn" name="enter" type="submit" value="確認画面へ進む">確認画面へ進む<svg class="ico_svg ico_right" fill="none" height="16" viewBox="0 0 16 16" width="16" xmlns="http://www.w3.org/2000/svg">

</path>
</svg>
</button>
    </div>
  </form>
</div>
