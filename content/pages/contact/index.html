

      <section id="form">

    <div class="form__main">

      <div class="form__block">
        <label class="form__ttl form__ttl--require" for="field-0-0" id="field-label-0">

      <div class="form__block">

          <input aria-labelledby="field-label-2" class="form__input" id="field-2-0" name="email" placeholder="例）example@example.com" required="" type="email" value=""/>

      </div>

      <div class="form__block">
        <label class="form__ttl form__ttl--require" for="field-3-0" id="field-label-3">

      <div class="form__block">
        <label class="form__ttl form__ttl--require" for="field-4-0" id="field-label-4">
<em>電話番号</em>
</label>
        <div class="form__item">
          <input aria-labelledby="field-label-4" class="form__input" id="field-4-0" name="tel" placeholder="例）09012345678" required="" type="tel" value=""/>
                  </div>
      </div>

      <div class="form__block">
        <label class="form__ttl form__ttl--require" for="field-5-0" id="field-label-5">
<em>お問い合わせ<br/>内容</em>
</label>
        <div class="form__item">
          <textarea aria-labelledby="field-label-5" class="form__textarea" id="field-5-0" name="message" placeholder="お問い合わせ内容を入力してください" required="">

<input name="policy_chk" required="" type="checkbox" value="1"/>

</div>
